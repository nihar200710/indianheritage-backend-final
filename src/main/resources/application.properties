# Essential for Render to detect your app is alive
server.port=${PORT:8080}

# Database Connection with Cloud-optimized flags
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/defaultdb?ssl-mode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (Dialect removed to prevent boot conflict)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Configuration
app.security.jwt-secret=AntiFSADDevelopmentJwtSecretKeyMinimum32Bytes2026
app.security.jwt-expiration-ms=86400000